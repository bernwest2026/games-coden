<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Rail Runner</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        color: white;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 700px;
        margin: auto;
        overflow: hidden;
        background: linear-gradient(#78c8ff 0%, #dff5ff 55%, #555 55%, #222 100%);
    }

    /* Himmel */
    .cloud {
        position: absolute;
        width: 100px;
        height: 30px;
        background: white;
        border-radius: 30px;
        opacity: .8;
    }

    .cloud::before,
    .cloud::after {
        content: "";
        position: absolute;
        background: white;
        border-radius: 50%;
    }

    .cloud::before {
        width: 45px;
        height: 45px;
        left: 15px;
        top: -20px;
    }

    .cloud::after {
        width: 55px;
        height: 55px;
        right: 10px;
        top: -25px;
    }

    /* Straße / Gleise */
    #road {
        position: absolute;
        left: 10%;
        width: 80%;
        top: 55%;
        bottom: 0;
        background: #333;
        transform: perspective(500px) rotateX(8deg);
        border-left: 5px solid #777;
        border-right: 5px solid #777;
    }

    .lane-line {
        position: absolute;
        width: 5px;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            #aaa 0px,
            #aaa 35px,
            transparent 35px,
            transparent 70px
        );
    }

    .lane1 {
        left: 33.33%;
    }

    .lane2 {
        left: 66.66%;
    }

    /* Spieler */
    #player {
        position: absolute;
        width: 45px;
        height: 60px;
        background: #3498db;
        border: 4px solid #fff;
        border-radius: 10px;
        bottom: 80px;
        transition: left .15s;
        z-index: 10;
    }

    #player::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        background: #ffd7a8;
        border-radius: 50%;
        top: -30px;
        left: 6px;
        border: 3px solid #fff;
    }

    #player.duck {
        height: 35px;
        bottom: 80px;
    }

    #player.jump {
        animation: jump .55s ease;
    }

    @keyframes jump {
        0%   { bottom: 80px; }
        50%  { bottom: 210px; }
        100% { bottom: 80px; }
    }

    /* Hindernisse */
    .obstacle {
        position: absolute;
        width: 55px;
        height: 55px;
        background: #e74c3c;
        border: 4px solid #fff;
        border-radius: 8px;
        z-index: 5;
    }

    .obstacle::after {
        content: "!";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
    }

    /* Münzen */
    .coin {
        position: absolute;
        width: 28px;
        height: 28px;
        background: #ffd700;
        border: 4px solid #fff3a0;
        border-radius: 50%;
        z-index: 4;
    }

    /* HUD */
    #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        font-weight: bold;
        z-index: 20;
        text-shadow: 2px 2px #000;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.75);
        z-index: 100;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
    }

    #gameOver h1 {
        font-size: 50px;
        margin: 10px;
    }

    button {
        border: 0;
        background: #2ecc71;
        color: white;
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
    }

    /* Mobile Buttons */
    #controls {
        position: absolute;
        bottom: 15px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 50;
    }

    #controls button {
        width: 65px;
        height: 55px;
        padding: 0;
        background: rgba(0,0,0,.55);
        border: 2px solid white;
    }

    @media (min-width: 700px) {
        #controls {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div class="cloud" style="top:100px; left:10%;"></div>
    <div class="cloud" style="top:170px; left:65%;"></div>

    <div id="hud">
        <div>🪙 <span id="score">0</span></div>
        <div>🏃 <span id="distance">0</span> m</div>
    </div>

    <div id="road">
        <div class="lane-line lane1"></div>
        <div class="lane-line lane2"></div>
    </div>

    <div id="player"></div>

    <div id="gameOver">
        <h1>Game Over!</h1>
        <p>Punkte: <span id="finalScore">0</span></p>
        <button onclick="restart()">Nochmal spielen</button>
    </div>

    <div id="controls">
        <button onclick="moveLeft()">←</button>
        <button onclick="jump()">↑</button>
        <button onclick="duck()">↓</button>
        <button onclick="moveRight()">→</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const distanceText = document.getElementById("distance");

let lane = 1;
let score = 0;
let distance = 0;
let speed = 5;
let running = true;

const lanes = ["22%", "50%", "78%"];

function updatePlayer() {
    player.style.left = lanes[lane];
    player.style.transform = "translateX(-50%)";
}

updatePlayer();

function moveLeft() {
    if (!running) return;

    if (lane > 0) {
        lane--;
        updatePlayer();
    }
}

function moveRight() {
    if (!running) return;

    if (lane < 2) {
        lane++;
        updatePlayer();
    }
}

function jump() {
    if (!running) return;

    if (!player.classList.contains("jump")) {
        player.classList.add("jump");

        setTimeout(() => {
            player.classList.remove("jump");
        }, 550);
    }
}

function duck() {
    if (!running) return;

    player.classList.add("duck");

    setTimeout(() => {
        player.classList.remove("duck");
    }, 600);
}

/* Tastatur */
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") moveLeft();
    if (e.key === "ArrowRight") moveRight();

    if (e.key === "ArrowUp" || e.key === " ") {
        e.preventDefault();
        jump();
    }

    if (e.key === "ArrowDown") duck();
});

/* Hindernis erzeugen */
function createObstacle() {
    if (!running) return;

    const obstacle = document.createElement("div");
    obstacle.className = "obstacle";

    const obstacleLane = Math.floor(Math.random() * 3);
    obstacle.dataset.lane = obstacleLane;

    obstacle.style.left = lanes[obstacleLane];
    obstacle.style.transform = "translateX(-50%)";

    obstacle.style.top = "-70px";

    game.appendChild(obstacle);

    let y = -70;

    const move = setInterval(() => {
        if (!running) {
            clearInterval(move);
            obstacle.remove();
            return;
        }

        y += speed;
        obstacle.style.top = y + "px";

        checkCollision(obstacle, move);

        if (y > window.innerHeight) {
            clearInterval(move);
            obstacle.remove();
        }
    }, 20);
}

/* Münze erzeugen */
function createCoin() {
    if (!running) return;

    const coin = document.createElement("div");
    coin.className = "coin";

    const coinLane = Math.floor(Math.random() * 3);

    coin.dataset.lane = coinLane;

    coin.style.left = lanes[coinLane];
    coin.style.transform = "translateX(-50%)";
    coin.style.top = "-40px";

    game.appendChild(coin);

    let y = -40;

    const move = setInterval(() => {
        if (!running) {
            clearInterval(move);
            coin.remove();
            return;
        }

        y += speed;
        coin.style.top = y + "px";

        const p = player.getBoundingClientRect();
        const c = coin.getBoundingClientRect();

        if (
            p.left < c.right &&
            p.right > c.left &&
            p.top < c.bottom &&
            p.bottom > c.top
        ) {
            score += 10;
            scoreText.textContent = score;

            coin.remove();
            clearInterval(move);
        }

        if (y > window.innerHeight) {
            coin.remove();
            clearInterval(move);
        }

    }, 20);
}

/* Kollision */
function checkCollision(obstacle, interval) {

    const p = player.getBoundingClientRect();
    const o = obstacle.getBoundingClientRect();

    const collision =
        p.left < o.right &&
        p.right > o.left &&
        p.top < o.bottom &&
        p.bottom > o.top;

    /*
       Beim Springen befindet sich der Spieler hoch oben.
       Dadurch kann er normale Hindernisse überspringen.
    */
    if (collision && !player.classList.contains("jump")) {
        gameOver();
        clearInterval(interval);
    }
}

/* Spielgeschwindigkeit */
setInterval(() => {
    if (!running) return;

    distance++;
    distanceText.textContent = distance;

    if (distance % 200 === 0) {
        speed += 0.7;
    }

}, 100);

/* Hindernisse regelmäßig */
setInterval(() => {
    if (running) createObstacle();
}, 1300);

/* Münzen regelmäßig */
setInterval(() => {
    if (running) createCoin();
}, 800);

/* Game Over */
function gameOver() {
    running = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}

/* Neustart */
function restart() {

    document.querySelectorAll(".obstacle, .coin").forEach(el => {
        el.remove();
    });

    score = 0;
    distance = 0;
    speed = 5;
    lane = 1;
    running = true;

    scoreText.textContent = "0";
    distanceText.textContent = "0";

    document.getElementById("gameOver").style.display = "none";

    updatePlayer();
}
</script>

</body>
</html>
