<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overwatch 2D – Genji Nomad</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #15191f;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
    user-select: none;
}

h1 {
    margin: 0 0 12px;
    color: #f99e1a;
    letter-spacing: 2px;
    font-size: 28px;
}

#ui {
    width: min(900px, 96vw);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: bold;
}

.team-blue {
    color: #35b9ff;
}

.team-red {
    color: #ff5353;
    text-align: right;
}

#point-status {
    text-align: center;
    color: #ffd166;
}

#gameCanvas {
    display: block;
    width: min(900px, 96vw);
    height: auto;
    border: 3px solid #46515f;
    background: #252d35;
    box-shadow: 0 10px 35px #0009;
    cursor: crosshair;
    touch-action: none;
}

#abilities {
    width: min(900px, 96vw);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.ability-box {
    min-width: 125px;
    padding: 9px 12px;
    background: #303943;
    border: 2px solid #596575;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.ready {
    border-color: #00e5a0;
    color: #00ffc3;
}

.cooldown {
    color: #ff7777;
    border-color: #9b4141;
}

#help {
    text-align: center;
    max-width: 900px;
    line-height: 1.8;
    font-size: 13px;
    color: #c6d0dc;
    margin-top: 12px;
}

#message {
    min-height: 26px;
    margin-top: 8px;
    color: #ffd166;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

button {
    border: 0;
    border-radius: 5px;
    padding: 9px 18px;
    background: #f99e1a;
    color: #171717;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    background: #ffbd4a;
}

@media (max-width: 600px) {
    h1 {
        font-size: 20px;
    }

    .ability-box {
        min-width: 105px;
        font-size: 11px;
        padding: 8px;
    }

    #ui {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h1>OVERWATCH 2D</h1>

<div id="ui">
    <div class="team-blue">
        🔵 BLAU: <span id="score-blue">0</span>%
    </div>

    <div id="point-status">
        PUNKT: NEUTRAL
    </div>

    <div class="team-red">
        🔴 ROT: <span id="score-red">0</span>%
    </div>
</div>

<canvas id="gameCanvas" width="900" height="550"></canvas>

<div id="abilities">
    <div class="ability-box" id="hp-box">❤️ HP: 200/200</div>
    <div class="ability-box ready" id="dash-box">SHIFT – Dash</div>
    <div class="ability-box ready" id="deflect-box">E – Reflektieren</div>
    <div class="ability-box" id="ult-box">Q – Drachenklinge: 0%</div>
</div>

<div id="message">Erobere den Kontrollpunkt!</div>

<div id="help">
    <b>WASD</b> Bewegen &nbsp;|&nbsp;
    <b>Maus</b> Zielen &nbsp;|&nbsp;
    <b>Linksklick</b> Shuriken werfen<br>
    <b>SHIFT</b> Sturmangriff &nbsp;|&nbsp;
    <b>E</b> Reflektieren &nbsp;|&nbsp;
    <b>Q</b> Drachenklinge &nbsp;|&nbsp;
    <b>R</b> Neustarten
</div>

<button id="restart-button">Spiel neu starten</button>

<script>
"use strict";

// =====================================================
// GRUNDLAGEN
// =====================================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const $ = id => document.getElementById(id);

const keys = Object.create(null);

const mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

const game = {
    blueScore: 0,
    redScore: 0,
    winner: null,
    paused: false,
    point: {
        x: W / 2,
        y: H / 2,
        radius: 75,
        owner: "neutral",
        progress: 0,
        status: "NEUTRAL"
    },
    lastTime: 0
};

let players = [];
let projectiles = [];
let particles = [];
let nextId = 1;

const obstacles = [
    { x: 185, y: 115, w: 90, h: 65 },
    { x: 625, y: 115, w: 90, h: 65 },
    { x: 185, y: 370, w: 90, h: 65 },
    { x: 625, y: 370, w: 90, h: 65 },
    { x: 400, y: 65, w: 100, h: 45 },
    { x: 400, y: 440, w: 100, h: 45 }
];

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function teamColor(team) {
    return team === "blue" ? "#24b9ff" : "#ff4b55";
}

function enemyTeam(team) {
    return team === "blue" ? "red" : "blue";
}

// =====================================================
// SPIELER
// =====================================================

class Player {
    constructor(x, y, team, isHuman = false) {
        this.id = nextId++;

        this.x = x;
        this.y = y;
        this.team = team;
        this.isHuman = isHuman;

        this.radius = isHuman ? 16 : 14;

        this.maxHp = 200;
        this.hp = this.maxHp;

        this.speed = isHuman ? 3.5 : 2.1;

        this.dashCooldown = 0;
        this.dashActive = 0;
        this.dashDX = 0;
        this.dashDY = 0;

        this.deflectCooldown = 0;
        this.deflectActive = 0;

        this.ultCharge = 0;
        this.ultActive = 0;

        this.shootCooldown = random(10, 30);
        this.respawnTimer = 0;

        this.facing = 0;
        this.kills = 0;

        this.aiThink = 0;
        this.target = null;
    }

    get alive() {
        return this.hp > 0 && this.respawnTimer <= 0;
    }

    update(dt) {
        if (this.respawnTimer > 0) {
            this.respawnTimer -= dt;

            if (this.respawnTimer <= 0) {
                this.respawn();
            }

            return;
        }

        if (this.hp <= 0) return;

        this.dashCooldown = Math.max(0, this.dashCooldown - dt);
        this.deflectCooldown = Math.max(0, this.deflectCooldown - dt);
        this.shootCooldown = Math.max(0, this.shootCooldown - dt);

        this.dashActive = Math.max(0, this.dashActive - dt);
        this.deflectActive = Math.max(0, this.deflectActive - dt);
        this.ultActive = Math.max(0, this.ultActive - dt);

        if (this.isHuman) {
            this.updateHuman(dt);
        } else {
            this.updateAI(dt);
        }

        if (this.ultActive > 0) {
            this.speed = this.isHuman ? 4.7 : 2.8;
        } else {
            this.speed = this.isHuman ? 3.5 : 2.1;
        }

        if (this.dashActive > 0) {
            this.move(
                this.dashDX * 12,
                this.dashDY * 12
            );

            if (Math.random() < 0.8) {
                particles.push({
                    x: this.x,
                    y: this.y,
                    vx: random(-1, 1),
                    vy: random(-1, 1),
                    r: random(3, 7),
                    life: 15,
                    maxLife: 15,
                    color: "#00ffd0"
                });
            }
        }

        this.x = clamp(this.x, this.radius, W - this.radius);
        this.y = clamp(this.y, this.radius, H - this.radius);

        this.checkObstacleCollision();
    }

    updateHuman(dt) {
        if (this.dashActive <= 0) {
            let mx = 0;
            let my = 0;

            if (keys["w"] || keys["arrowup"]) my--;
            if (keys["s"] || keys["arrowdown"]) my++;
            if (keys["a"] || keys["arrowleft"]) mx--;
            if (keys["d"] || keys["arrowright"]) mx++;

            const len = Math.hypot(mx, my);

            if (len > 0) {
                mx /= len;
                my /= len;

                this.move(mx * this.speed * dt, my * this.speed * dt);
            }
        }

        this.facing = Math.atan2(mouse.y - this.y, mouse.x - this.x);

        if (mouse.down && this.shootCooldown <= 0) {
            this.fireWeapon();
        }

        // Ultimative Fähigkeit lädt sich durch Zeit und Schaden auf.
        if (this.ultCharge < 100) {
            this.ultCharge = Math.min(100, this.ultCharge + 0.003 * dt);
        }
    }

    updateAI(dt) {
        this.aiThink -= dt;

        let nearest = null;
        let nearestDistance = Infinity;

        for (const p of players) {
            if (!p.alive || p.team === this.team) continue;

            const d = distance(this.x, this.y, p.x, p.y);

            if (d < nearestDistance) {
                nearest = p;
                nearestDistance = d;
            }
        }

        this.target = nearest;

        const point = game.point;

        let tx = point.x;
        let ty = point.y;

        if (nearest && nearestDistance < 300) {
            tx = nearest.x;
            ty = nearest.y;

            this.facing = Math.atan2(
                nearest.y - this.y,
                nearest.x - this.x
            );

            if (this.shootCooldown <= 0) {
                this.fireWeapon();
            }

            // Bots reflektieren gelegentlich in gefährlichen Situationen.
            if (
                nearestDistance < 120 &&
                this.deflectCooldown <= 0 &&
                Math.random() < 0.006 * dt
            ) {
                this.useDeflect();
            }
        } else {
            // Kleine Formation rund um den Kontrollpunkt.
            const offset = this.id * 2.399;
            tx += Math.cos(offset) * 35;
            ty += Math.sin(offset) * 35;

            this.facing = Math.atan2(ty - this.y, tx - this.x);
        }

        const d = distance(this.x, this.y, tx, ty);

        if (d > 35 && this.dashActive <= 0) {
            let dx = (tx - this.x) / d;
            let dy = (ty - this.y) / d;

            // Hindernissen etwas ausweichen.
            const nextX = this.x + dx * this.speed * dt;
            const nextY = this.y + dy * this.speed * dt;

            if (this.isBlocked(nextX, nextY)) {
                const angle = Math.atan2(dy, dx) + Math.PI / 2;
                dx = Math.cos(angle);
                dy = Math.sin(angle);
            }

            this.move(
                dx * this.speed * dt,
                dy * this.speed * dt
            );
        }

        if (
            nearest &&
            nearestDistance < 100 &&
            this.dashCooldown <= 0 &&
            Math.random() < 0.003 * dt
        ) {
            this.useDash();
        }

        if (this.ultCharge >= 100 && nearest && nearestDistance < 140) {
            this.useUltimate();
        }

        this.ultCharge = Math.min(100, this.ultCharge + 0.001 * dt);
    }

    move(dx, dy) {
        const nx = clamp(this.x + dx, this.radius, W - this.radius);
        const ny = clamp(this.y + dy, this.radius, H - this.radius);

        if (!this.isBlocked(nx, this.y)) {
            this.x = nx;
        }

        if (!this.isBlocked(this.x, ny)) {
            this.y = ny;
        }
    }

    isBlocked(x, y) {
        for (const o of obstacles) {
            const cx = clamp(x, o.x, o.x + o.w);
            const cy = clamp(y, o.y, o.y + o.h);

            if (distance(x, y, cx, cy) < this.radius) {
                return true;
            }
        }

        return false;
    }

    checkObstacleCollision() {
        for (const o of obstacles) {
            const cx = clamp(this.x, o.x, o.x + o.w);
            const cy = clamp(this.y, o.y, o.y + o.h);

            const d = distance(this.x, this.y, cx, cy);

            if (d < this.radius && d > 0) {
                const dx = (this.x - cx) / d;
                const dy = (this.y - cy) / d;

                this.x += dx * (this.radius - d);
                this.y += dy * (this.radius - d);
            }
        }
    }

    fireWeapon() {
        if (!this.alive || this.shootCooldown > 0) return;

        let angle = this.facing;

        if (this.isHuman) {
            angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
        }

        // Drei Shuriken in einem kleinen Fächer.
        const spread = this.ultActive > 0 ? 0.10 : 0.16;

        for (const offset of [-spread, 0, spread]) {
            const a = angle + offset;

            projectiles.push(new Projectile(
                this.x + Math.cos(a) * 20,
                this.y + Math.sin(a) * 20,
                Math.cos(a),
                Math.sin(a),
                this.team,
                this,
                this.ultActive > 0 ? 18 : 12
            ));
        }

        this.shootCooldown = this.isHuman ? 17 : random(35, 55);
    }

    useDash() {
        if (
            !this.alive ||
            this.dashCooldown > 0 ||
            this.dashActive > 0
        ) return;

        let dx;
        let dy;

        if (this.isHuman) {
            dx = mouse.x - this.x;
            dy = mouse.y - this.y;
        } else if (this.target && this.target.alive) {
            dx = this.target.x - this.x;
            dy = this.target.y - this.y;
        } else {
            dx = Math.cos(this.facing);
            dy = Math.sin(this.facing);
        }

        const len = Math.hypot(dx, dy);

        if (len === 0) return;

        this.dashDX = dx / len;
        this.dashDY = dy / len;

        this.dashActive = 10;
        this.dashCooldown = 240;

        // Schaden entlang der Dash-Bahn.
        for (const p of players) {
            if (!p.alive || p.team === this.team) continue;

            const vx = p.x - this.x;
            const vy = p.y - this.y;

            const projection = vx * this.dashDX + vy * this.dashDY;

            if (projection >= 0 && projection < 125) {
                const perpendicular = Math.abs(
                    vx * this.dashDY - vy * this.dashDX
                );

                if (perpendicular < p.radius + 17) {
                    p.takeDamage(50, this);
                }
            }
        }

        for (let i = 0; i < 10; i++) {
            particles.push({
                x: this.x,
                y: this.y,
                vx: random(-3, 3),
                vy: random(-3, 3),
                r: random(2, 5),
                life: 20,
                maxLife: 20,
                color: "#00ffd0"
            });
        }
    }

    useDeflect() {
        if (!this.alive || this.deflectCooldown > 0) return;

        this.deflectActive = 90;
        this.deflectCooldown = 360;
    }

    useUltimate() {
        if (!this.alive || this.ultCharge < 100) return;

        this.ultActive = 360;
        this.ultCharge = 0;

        particles.push({
            x: this.x,
            y: this.y,
            vx: 0,
            vy: 0,
            r: 45,
            life: 35,
            maxLife: 35,
            color: "#76ff03"
        });
    }

    takeDamage(amount, attacker) {
        if (!this.alive) return;

        if (this.deflectActive > 0 && attacker) {
            // Projektile werden separat reflektiert.
            return;
        }

        this.hp -= amount;

        if (this.isHuman) {
            this.ultCharge = Math.min(100, this.ultCharge + amount * 0.08);
        }

        if (this.hp <= 0) {
            this.hp = 0;
            this.respawnTimer = 120;

            if (attacker && attacker.team !== this.team) {
                attacker.kills++;
                attacker.ultCharge = Math.min(
                    100,
                    attacker.ultCharge + 15
                );
            }

            for (let i = 0; i < 18; i++) {
                particles.push({
                    x: this.x,
                    y: this.y,
                    vx: random(-4, 4),
                    vy: random(-4, 4),
                    r: random(2, 6),
                    life: 30,
                    maxLife: 30,
                    color: teamColor(this.team)
                });
            }
        }
    }

    respawn() {
        this.hp = this.maxHp;
        this.respawnTimer = 0;

        this.x = this.team === "blue" ? random(35, 90) : random(W - 90, W - 35);
        this.y = random(90, H - 90);

        this.deflectActive = 0;
        this.ultActive = 0;
        this.dashActive = 0;
    }

    draw() {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Team-Aura.
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = this.team === "blue"
            ? "rgba(0,170,255,0.20)"
            : "rgba(255,40,55,0.20)";
        ctx.fill();

        if (this.isHuman) {
            // Nomaden-Mantel.
            ctx.fillStyle = "#d7c4a5";
            ctx.beginPath();
            ctx.ellipse(0, 2, 15, 17, 0, 0, Math.PI * 2);
            ctx.fill();

            // Schulter- und Armrüstung.
            ctx.fillStyle = "#624637";
            ctx.fillRect(-13, -3, 7, 13);
            ctx.fillRect(6, -3, 7, 13);

            // Weißer Schal.
            ctx.fillStyle = "#f4f0e8";
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            // Kopf.
            ctx.fillStyle = "#44322c";
            ctx.beginPath();
            ctx.arc(0, -3, 6, 0, Math.PI * 2);
            ctx.fill();

            // Leuchtendes Stirnband.
            ctx.fillStyle = "#00e5ff";
            ctx.fillRect(-5, -5, 10, 2);

            // Grüner Akzent.
            ctx.fillStyle = "#8cff45";
            ctx.fillRect(2, -10, 3, 5);
        } else {
            // Bots.
            ctx.fillStyle = teamColor(this.team);
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(0, -2, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Blickrichtung.
        ctx.rotate(this.facing);
        ctx.fillStyle = "#c7f7ff";
        ctx.fillRect(5, -2, 15, 4);

        ctx.restore();

        // Deflect-Schild.
        if (this.deflectActive > 0) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 9, 0, Math.PI * 2);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Ultimate-Aura.
        if (this.ultActive > 0) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 7, 0, Math.PI * 2);
            ctx.strokeStyle = "#76ff03";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(
                this.x + Math.cos(this.facing) * 35,
                this.y + Math.sin(this.facing) * 35
            );
            ctx.strokeStyle = "#aaff33";
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        // Lebensbalken.
        const barWidth = 38;

        ctx.fillStyle = "#202020";
        ctx.fillRect(
            this.x - barWidth / 2,
            this.y - 27,
            barWidth,
            5
        );

        ctx.fillStyle = this.hp > 60 ? "#00e676" : "#ff5252";
        ctx.fillRect(
            this.x - barWidth / 2,
            this.y - 27,
            barWidth * (this.hp / this.maxHp),
            5
        );

        // Spielerkennzeichnung.
        if (this.isHuman) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GENJI", this.x, this.y - 34);
        }
    }
}

// =====================================================
// PROJEKTILE
// =====================================================

class Projectile {
    constructor(x, y, dx, dy, team, owner, damage = 12) {
        this.x = x;
        this.y = y;
        this.dx = dx;
        this.dy = dy;
        this.team = team;
        this.owner = owner;
        this.damage = damage;
        this.speed = 8;
        this.life = 85;
        this.radius = 4;
        this.dead = false;
        this.reflected = false;
    }

    update(dt) {
        if (this.dead) return;

        this.x += this.dx * this.speed * dt;
        this.y += this.dy * this.speed * dt;
        this.life -= dt;

        if (
            this.life <= 0 ||
            this.x < 0 ||
            this.x > W ||
            this.y < 0 ||
            this.y > H
        ) {
            this.dead = true;
            return;
        }

        // Hindernisse blockieren Projektile.
        for (const o of obstacles) {
            if (
                this.x >= o.x &&
                this.x <= o.x + o.w &&
                this.y >= o.y &&
                this.y <= o.y + o.h
            ) {
                this.dead = true;
                return;
            }
        }

        for (const p of players) {
            if (!p.alive || p.team === this.team) continue;

            if (
                distance(this.x, this.y, p.x, p.y) <
                this.radius + p.radius
            ) {
                if (p.deflectActive > 0 && !this.reflected) {
                    // Projektil auf den ursprünglichen Angreifer zurückwerfen.
                    this.team = p.team;
                    this.owner = p;
                    this.reflected = true;

                    const target = players.find(
                        candidate =>
                            candidate.id === this.owner.id &&
                            candidate.team !== this.team
                    );

                    if (target) {
                        const a = Math.atan2(
                            target.y - this.y,
                            target.x - this.x
                        );

                        this.dx = Math.cos(a);
                        this.dy = Math.sin(a);
                    } else {
                        this.dx *= -1;
                        this.dy *= -1;
                    }

                    this.damage *= 1.5;
                    this.x += this.dx * 12;
                    this.y += this.dy * 12;
                    return;
                }

                p.takeDamage(this.damage, this.owner);
                this.dead = true;

                particles.push({
                    x: this.x,
                    y: this.y,
                    vx: random(-1.5, 1.5),
                    vy: random(-1.5, 1.5),
                    r: 4,
                    life: 12,
                    maxLife: 12,
                    color: "#ffe082"
                });

                return;
            }
        }
    }

    draw() {
        if (this.dead) return;

        ctx.save();

        ctx.translate(this.x, this.y);
        ctx.rotate(Math.atan2(this.dy, this.dx));

        ctx.fillStyle = this.team === "blue" ? "#71e5ff" : "#ff8a80";
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;

        ctx.beginPath();
        ctx.moveTo(7, 0);
        ctx.lineTo(-4, -4);
        ctx.lineTo(-2, 0);
        ctx.lineTo(-4, 4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }
}

// =====================================================
// SPIEL STARTEN / ZURÜCKSETZEN
// =====================================================

function resetGame() {
    players = [];
    projectiles = [];
    particles = [];
    nextId = 1;

    game.blueScore = 0;
    game.redScore = 0;
    game.winner = null;

    game.point.owner = "neutral";
    game.point.progress = 0;
    game.point.status = "NEUTRAL";

    // Der menschliche Spieler.
    players.push(new Player(85, H / 2, "blue", true));

    // Drei verbündete Bots.
    players.push(new Player(70, 200, "blue"));
    players.push(new Player(70, 350, "blue"));
    players.push(new Player(120, 280, "blue"));

    // Vier gegnerische Bots.
    players.push(new Player(W - 70, 180, "red"));
    players.push(new Player(W - 70, 280, "red"));
    players.push(new Player(W - 70, 370, "red"));
    players.push(new Player(W - 120, 240, "red"));

    mouse.down = false;

    $("message").textContent = "Erobere den Kontrollpunkt!";
    updateUI();
}

// =====================================================
// KONTROLLPUNKT
// =====================================================

function updateControlPoint(dt) {
    if (game.winner) return;

    const point = game.point;

    let blueCount = 0;
    let redCount = 0;

    for (const p of players) {
        if (!p.alive) continue;

        if (
            distance(p.x, p.y, point.x, point.y) <= point.radius
        ) {
            if (p.team === "blue") blueCount++;
            else redCount++;
        }
    }

    if (blueCount > 0 && redCount === 0) {
        point.owner = "blue";
        point.progress += 0.025 * dt;
        point.status = "BLAU EROBERT";

    } else if (redCount > 0 && blueCount === 0) {
        point.owner = "red";
        point.progress += 0.025 * dt;
        point.status = "ROT EROBERT";

    } else if (blueCount > 0 && redCount > 0) {
        point.status = "UMKÄMPFT";

    } else {
        point.status = point.owner === "neutral"
            ? "NEUTRAL"
            : point.owner === "blue"
                ? "BLAU KONTROLLIERT"
                : "ROT KONTROLLIERT";
    }

    point.progress = clamp(point.progress, 0, 100);

    if (point.owner === "blue" && blueCount > 0 && redCount === 0) {
        game.blueScore += 0.018 * dt;
    }

    if (point.owner === "red" && redCount > 0 && blueCount === 0) {
        game.redScore += 0.018 * dt;
    }

    game.blueScore = clamp(game.blueScore, 0, 100);
    game.redScore = clamp(game.redScore, 0, 100);

    if (game.blueScore >= 100) {
        game.winner = "blue";
        $("message").textContent = "🏆 SIEG! TEAM BLAU HAT GEWONNEN!";
    } else if (game.redScore >= 100) {
        game.winner = "red";
        $("message").textContent = "💀 NIEDERLAGE! TEAM ROT HAT GEWONNEN!";
    }
}

// =====================================================
// PARTIKEL
// =====================================================

function updateParticles(dt) {
    for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
    }

    particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// =====================================================
// SPIELFELD ZEICHNEN
// =====================================================

function drawMap() {
    ctx.clearRect(0, 0, W, H);

    // Boden.
    ctx.fillStyle = "#252f38";
    ctx.fillRect(0, 0, W, H);

    // Bodenraster.
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;

    for (let x = 0; x <= W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (let y = 0; y <= H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    // Team-Startbereiche.
    ctx.fillStyle = "rgba(0,150,255,0.07)";
    ctx.fillRect(0, 0, 120, H);

    ctx.fillStyle = "rgba(255,45,55,0.07)";
    ctx.fillRect(W - 120, 0, 120, H);

    // Hindernisse.
    for (const o of obstacles) {
        ctx.fillStyle = "#46515b";
        ctx.fillRect(o.x, o.y, o.w, o.h);

        ctx.strokeStyle = "#71808e";
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(o.x + 6, o.y + 6, o.w - 12, o.h - 12);
    }

    // Kontrollpunkt.
    const p = game.point;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius + 10, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.025)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

    if (p.owner === "blue") {
        ctx.fillStyle = "rgba(0,162,255,0.18)";
        ctx.strokeStyle = "#00a2ff";
    } else if (p.owner === "red") {
        ctx.fillStyle = "rgba(255,51,51,0.18)";
        ctx.strokeStyle = "#ff3333";
    } else {
        ctx.fillStyle = "rgba(255,255,255,0.07)";
        ctx.strokeStyle = "#d0d0d0";
    }

    ctx.fill();
    ctx.lineWidth = 4;
    ctx.stroke();

    // Innere Markierungen.
    ctx.beginPath();
    ctx.arc(p.x, p.y, 35, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.fillText("KONTROLLPUNKT", p.x, p.y - 3);

    ctx.font = "12px Arial";
    ctx.fillStyle = "#ffd166";
    ctx.fillText(p.status, p.x, p.y + 16);

    // Spielfeldrand.
    ctx.strokeStyle = "#566574";
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);
}

function drawCrosshair() {
    ctx.save();

    ctx.translate(mouse.x, mouse.y);

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.moveTo(-13, 0);
    ctx.lineTo(-5, 0);
    ctx.moveTo(5, 0);
    ctx.lineTo(13, 0);
    ctx.moveTo(0, -13);
    ctx.lineTo(0, -5);
    ctx.moveTo(0, 5);
    ctx.lineTo(0, 13);
    ctx.stroke();

    ctx.restore();
}

// =====================================================
// BENUTZEROBERFLÄCHE
// =====================================================

function updateUI() {
    $("score-blue").textContent = Math.floor(game.blueScore);
    $("score-red").textContent = Math.floor(game.redScore);

    $("point-status").textContent = game.point.status;

    const hero = players.find(p => p.isHuman);
    if (!hero) return;

    $("hp-box").textContent =
        `❤️ HP: ${Math.ceil(hero.hp)}/${hero.maxHp}`;

    setAbility(
        "dash-box",
        "SHIFT – Dash",
        hero.dashCooldown,
        240
    );

    setAbility(
        "deflect-box",
        "E – Reflektieren",
        hero.deflectCooldown,
        360
    );

    $("ult-box").textContent =
        hero.ultActive > 0
            ? "🐉 DRACHENKLINGE AKTIV!"
            : `Q – Drachenklinge: ${Math.floor(hero.ultCharge)}%`;

    $("ult-box").className =
        "ability-box " +
        (hero.ultCharge >= 100 ? "ready" : "");

    if (!hero.alive) {
        $("hp-box").textContent =
            `💀 Respawn: ${Math.max(0, Math.ceil(hero.respawnTimer / 60))}s`;
    }
}

function setAbility(id, label, cooldown, total) {
    const el = $(id);

    if (cooldown > 0) {
        el.className = "ability-box cooldown";
        el.textContent =
            `${label} (${(cooldown / 60).toFixed(1)}s)`;
    } else {
        el.className = "ability-box ready";
        el.textContent = label;
    }
}

// =====================================================
// SPIELSTEUERUNG
// =====================================================

function getHero() {
    return players.find(p => p.isHuman);
}

function activateKey(key) {
    const hero = getHero();

    if (!hero || game.winner) return;

    if (key === "shift") hero.useDash();
    if (key === "e") hero.useDeflect();
    if (key === "q") hero.useUltimate();
}

window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (
        ["w", "a", "s", "d", "arrowup", "arrowdown",
         "arrowleft", "arrowright", " "].includes(key)
    ) {
        event.preventDefault();
    }

    if (!keys[key]) {
        if (key === "shift") activateKey("shift");
        if (key === "e") activateKey("e");
        if (key === "q") activateKey("q");

        if (key === "r") resetGame();
    }

    keys[key] = true;
});

window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

function updateMouse(event) {
    const rect = canvas.getBoundingClientRect();

    mouse.x = (event.clientX - rect.left) * W / rect.width;
    mouse.y = (event.clientY - rect.top) * H / rect.height;
}

canvas.addEventListener("pointermove", updateMouse);

canvas.addEventListener("pointerdown", event => {
    updateMouse(event);

    if (event.button === 0) {
        mouse.down = true;
    }
});

window.addEventListener("pointerup", event => {
    if (event.button === 0) {
        mouse.down = false;
    }
});

canvas.addEventListener("contextmenu", event => {
    event.preventDefault();
});

$("restart-button").addEventListener("click", resetGame);

// =====================================================
// HAUPTSPIELSCHLEIFE
// =====================================================

function update(dt) {
    if (game.winner) {
        updateParticles(dt);
        return;
    }

    for (const player of players) {
        player.update(dt);
    }

    for (const projectile of projectiles) {
        projectile.update(dt);
    }

    projectiles = projectiles.filter(p => !p.dead);

    updateParticles(dt);
    updateControlPoint(dt);
    updateUI();
}

function draw() {
    drawMap();

    for (const projectile of projectiles) {
        projectile.draw();
    }

    // Bots zuerst zeichnen.
    for (const player of players) {
        if (!player.isHuman) player.draw();
    }

    // Genji zuletzt zeichnen.
    const hero = getHero();

    if (hero) hero.draw();

    drawParticles();
    drawCrosshair();

    if (game.winner) {
        ctx.fillStyle = "rgba(0,0,0,0.72)";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = game.winner === "blue"
            ? "#4fc3f7"
            : "#ff5252";

        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            game.winner === "blue" ? "SIEG!" : "NIEDERLAGE!",
            W / 2,
            H / 2 - 10
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Arial";

        ctx.fillText(
            "Drücke R oder klicke auf Neustart",
            W / 2,
            H / 2 + 35
        );
    }
}

function gameLoop(timestamp) {
    if (!game.lastTime) game.lastTime = timestamp;

    // Delta-Time begrenzen, damit das Spiel bei kurzen
    // Verzögerungen nicht plötzlich große Sprünge macht.
    const dt = Math.min((timestamp - game.lastTime) / (1000 / 60), 2);

    game.lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

// =====================================================
// LOS GEHT'S!
// =====================================================

resetGame();
requestAnimationFrame(gameLoop);

</script>
