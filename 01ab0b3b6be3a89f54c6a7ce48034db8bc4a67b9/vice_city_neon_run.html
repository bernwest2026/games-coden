<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE CITY: NEON RUN</title>
<style>
*{box-sizing:border-box} body{margin:0;overflow:hidden;background:#05030b;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{width:100vw;height:100vh;display:block;background:linear-gradient(#ff6aa2 0%,#7b3cff 45%,#131029 46%,#090912 100%)}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;left:24px;top:18px;font-weight:1000;font-size:clamp(28px,5vw,68px);line-height:.8;font-style:italic;text-shadow:5px 5px 0 #ff4f9b,10px 10px 0 rgba(0,0,0,.35)}
#title small{font-size:.32em;letter-spacing:.35em;display:block;margin-top:14px;color:#7ff9ff;text-shadow:none}
#stats{position:absolute;right:24px;top:22px;text-align:right;font-weight:800;font-size:18px;line-height:1.6}
#wanted{color:#ffd45c;letter-spacing:4px}
#mission{position:absolute;left:50%;transform:translateX(-50%);top:28px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);padding:12px 18px;border-radius:12px;font-weight:800;backdrop-filter:blur(6px)}
#help{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;background:rgba(0,0,0,.55);padding:10px 16px;border-radius:10px;font-size:14px}
#toast{position:absolute;left:50%;top:100px;transform:translateX(-50%);font-weight:900;font-size:28px;color:#7ff9ff;text-shadow:0 2px 14px #00c8ff;opacity:0;transition:.25s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">VICE CITY<small>NEON RUN</small></div>
  <div id="mission">MISSION: Sammle 15 Geldtaschen</div>
  <div id="stats">💵 <span id="cash">0</span><br><span id="wanted">☆☆☆☆☆</span></div>
  <div id="toast"></div>
  <div id="help">WASD / Pfeiltasten: fahren · SPACE: Boost · R: Neustart</div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,keys={},player,items,traffic,score,wanted,done,last=0,toastT=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight} addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const rnd=(a,b)=>Math.random()*(b-a)+a;
function reset(){
 score=0;wanted=0;done=false;
 player={x:W*.5,y:H*.72,a:-Math.PI/2,v:0};
 items=Array.from({length:15},()=>({x:rnd(80,W-80),y:rnd(H*.18,H-80),r:12,got:false}));
 traffic=Array.from({length:20},()=>({x:rnd(0,W),y:rnd(H*.15,H),v:rnd(1.2,3.5)*(Math.random()<.5?1:-1),lane:Math.random()<.5?0:1,w:rnd(26,42),h:rnd(48,72)}));
}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;toastT=1.6}
function drawCity(){
 // horizon glow
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ff86ad');g.addColorStop(.43,'#44205f');g.addColorStop(.44,'#15132b');g.addColorStop(1,'#07070b');x.fillStyle=g;x.fillRect(0,0,W,H);
 // skyline
 for(let i=0;i<36;i++){let bw=35+(i%5)*22,bh=40+((i*37)%130),bx=(i*79)%W,by=H*.44-bh;x.fillStyle=i%3?'#161128':'#21132f';x.fillRect(bx,by,bw,bh);x.fillStyle='rgba(112,249,255,.55)';for(let yy=by+12;yy<by+bh-8;yy+=16)x.fillRect(bx+8,yy,5,3)}
 // roads
 x.fillStyle='#15151c';x.fillRect(0,H*.45,W,H*.55);
 x.strokeStyle='#ffdf66';x.lineWidth=5;x.setLineDash([24,24]);x.beginPath();x.moveTo(W*.5,H*.45);x.lineTo(W*.5,H);x.stroke();x.setLineDash([]);
 x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;for(let i=0;i<9;i++){let yy=H*.5+i*90;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy-40);x.stroke()}
 // palm silhouettes
 for(let i=0;i<8;i++){let px=i*W/7+20,py=H*.47;x.strokeStyle='#07070b';x.lineWidth=7;x.beginPath();x.moveTo(px,py);x.lineTo(px+10,py-90);x.stroke();for(let a=0;a<6;a++){let an=a*Math.PI/3;x.beginPath();x.moveTo(px+10,py-85);x.lineTo(px+10+Math.cos(an)*45,py-85+Math.sin(an)*24);x.stroke()}}
}
function car(o,neon){
 x.save();x.translate(o.x,o.y);x.rotate(o.a||0);
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(-18,-34,36,68);
 x.fillStyle=neon?'#ff3d96':'#343445';x.fillRect(-15,-30,30,60);
 x.fillStyle='#7ff9ff';x.fillRect(-11,-20,22,22);
 x.fillStyle='#111';x.fillRect(-19,-22,6,16);x.fillRect(13,-22,6,16);x.fillRect(-19,10,6,16);x.fillRect(13,10,6,16);
 x.fillStyle='#fff4b0';x.fillRect(-9,-31,7,4);x.fillRect(2,-31,7,4);
 x.restore();
}
function loop(t){
 let dt=Math.min(2,(t-last)/16.67||1);last=t;
 drawCity();
 if(!done){
  let acc=(keys.w||keys.arrowup?0.22:0)-(keys.s||keys.arrowdown?0.12:0);
  player.v=(player.v+acc*dt)*0.985;if(keys[' '])player.v+=.12*dt;
  player.v=Math.max(-3,Math.min(8,player.v));
  if(Math.abs(player.v)>.2){let turn=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);player.a+=turn*.045*dt*(player.v/3)}
  player.x+=Math.cos(player.a)*player.v*dt;player.y+=Math.sin(player.a)*player.v*dt;
  player.x=(player.x+W)%W;player.y=Math.max(H*.48,Math.min(H-25,player.y));
  for(const tr of traffic){tr.y+=tr.v*dt;if(tr.y>H+80)tr.y=H*.46;if(tr.y<H*.43)tr.y=H+70;car({...tr,a:Math.PI/2},false);
   if(Math.hypot(tr.x-player.x,tr.y-player.y)<35){player.v*=-.35;wanted=Math.min(5,wanted+1);toast('CRASH! Polizei nicht begeistert.')}
  }
  for(const it of items)if(!it.got){x.beginPath();x.arc(it.x,it.y,it.r,0,7);x.fillStyle='#7ff9ff';x.shadowColor='#00eaff';x.shadowBlur=18;x.fill();x.shadowBlur=0;x.fillStyle='#06121a';x.font='bold 15px Arial';x.fillText('$',it.x-5,it.y+5);if(Math.hypot(it.x-player.x,it.y-player.y)<30){it.got=true;score+=100;toast('+$100');if(items.every(z=>z.got)){done=true;toast('MISSION ERLEDIGT. Kapitalismus gewinnt.')}}}
  car(player,true);
 }
 document.getElementById('cash').textContent=score;
 document.getElementById('wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);
 if(done){x.fillStyle='rgba(0,0,0,.58)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 clamp(40px,8vw,100px) Arial';x.fillText('MISSION COMPLETE',W/2,H/2);x.font='24px Arial';x.fillText('Drück R für eine neue Runde',W/2,H/2+55);x.textAlign='left'}
 if(toastT>0){toastT-=dt/60;document.getElementById('toast').style.opacity=toastT>0?1:0}
 requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
