<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎹 Klavier</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #222;
        font-family: Arial, sans-serif;
    }

    .container {
        background: #111;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 40px #000;
    }

    h1 {
        color: white;
        text-align: center;
        margin: 0 0 20px;
    }

    .piano {
        position: relative;
        width: 560px;
        height: 260px;
    }

    /* Weiße Tasten */
    .white-keys {
        display: flex;
        width: 100%;
        height: 100%;
    }

    .white {
        position: relative;
        width: 70px;
        height: 260px;
        background: linear-gradient(to bottom, #fff, #ddd);
        border: 1px solid #222;
        border-radius: 0 0 8px 8px;

        display: flex;
        justify-content: center;
        align-items: flex-end;

        padding-bottom: 15px;

        font-size: 18px;
        font-weight: bold;
        color: #555;

        cursor: pointer;
        user-select: none;
    }

    .white:hover {
        background: #eee;
    }

    /* Schwarze Tasten */
    .black {
        position: absolute;
        top: 0;

        width: 44px;
        height: 160px;

        background: linear-gradient(
            to right,
            #050505,
            #333,
            #050505
        );

        border: 2px solid #000;
        border-radius: 0 0 7px 7px;

        color: white;

        display: flex;
        justify-content: center;
        align-items: flex-end;

        padding-bottom: 12px;

        font-size: 14px;
        font-weight: bold;

        cursor: pointer;
        user-select: none;

        z-index: 5;

        box-shadow: 0 6px 8px rgba(0,0,0,0.5);
    }

    .black:hover {
        background: linear-gradient(
            to right,
            #222,
            #555,
            #222
        );
    }

    /* Position der schwarzen Tasten */

    .black.c-sharp {
        left: 48px;
    }

    .black.d-sharp {
        left: 118px;
    }

    .black.f-sharp {
        left: 258px;
    }

    .black.g-sharp {
        left: 328px;
    }

    .black.a-sharp {
        left: 398px;
    }

    /* Wenn Taste gedrückt wird */

    .pressed {
        transform: translateY(5px);
        filter: brightness(0.75);
    }

    /* Handy */
    @media (max-width: 650px) {

        .container {
            transform: scale(0.65);
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎹 Mein Klavier</h1>

    <div class="piano">

        <!-- WEISSE TASTEN -->

        <div class="white-keys">

            <div class="white" data-note="C4" data-key="a">
                A
            </div>

            <div class="white" data-note="D4" data-key="s">
                S
            </div>

            <div class="white" data-note="E4" data-key="d">
                D
            </div>

            <div class="white" data-note="F4" data-key="f">
                F
            </div>

            <div class="white" data-note="G4" data-key="g">
                G
            </div>

            <div class="white" data-note="A4" data-key="h">
                H
            </div>

            <div class="white" data-note="B4" data-key="j">
                J
            </div>

            <div class="white" data-note="C5" data-key="k">
                K
            </div>

        </div>


        <!-- SCHWARZE TASTEN -->

        <div class="black c-sharp"
             data-note="C#4"
             data-key="w">
            W
        </div>

        <div class="black d-sharp"
             data-note="D#4"
             data-key="e">
            E
        </div>

        <div class="black f-sharp"
             data-note="F#4"
             data-key="t">
            T
        </div>

        <div class="black g-sharp"
             data-note="G#4"
             data-key="z">
            Z
        </div>

        <div class="black a-sharp"
             data-note="A#4"
             data-key="u">
            U
        </div>

    </div>

</div>

<script>

let audioContext = null;

const notes = {
    "C4": 261.63,
    "C#4": 277.18,
    "D4": 293.66,
    "D#4": 311.13,
    "E4": 329.63,
    "F4": 349.23,
    "F#4": 369.99,
    "G4": 392.00,
    "G#4": 415.30,
    "A4": 440.00,
    "A#4": 466.16,
    "B4": 493.88,
    "C5": 523.25
};

function playNote(note) {

    if (!audioContext) {
        audioContext = new AudioContext();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = notes[note];

    gain.gain.setValueAtTime(0.5, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 1
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 1);
}

function pressKey(key) {

    const note = key.dataset.note;

    playNote(note);

    key.classList.add("pressed");

    setTimeout(() => {
        key.classList.remove("pressed");
    }, 150);
}


/* Mausklick */

document.querySelectorAll(".white, .black").forEach(key => {

    key.addEventListener("pointerdown", function(event) {

        event.preventDefault();

        pressKey(this);

    });

});


/* Tastatur */

document.addEventListener("keydown", function(event) {

    if (event.repeat) return;

    const key = document.querySelector(
        `[data-key="${event.key.toLowerCase()}"]`
    );

    if (key) {
        pressKey(key);
    }

});

</script>
