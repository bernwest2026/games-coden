<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bern Scooter 3D</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #87ceeb; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #ui {
        position: fixed; top: 15px; left: 15px; z-index: 10;
        color: white; background: rgba(0,0,0,.7);
        padding: 15px; border-radius: 12px; line-height: 1.7;
        min-width: 220px; text-shadow: 1px 1px black;
    }
    #controls {
        position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
        color: white; background: rgba(0,0,0,.7);
        padding: 12px 20px; border-radius: 12px;
        text-align: center; line-height: 1.7; width: max-content;
        max-width: 95vw;
    }
    #crosshair {
        position: fixed; left: 50%; top: 50%;
        width: 5px; height: 5px; background: white;
        border-radius: 50%; pointer-events: none;
    }
    button {
        padding: 9px 13px; margin-top: 5px; border: 0;
        border-radius: 7px; cursor: pointer; font-weight: bold;
    }
</style>
</head>
<body>

<div id="ui">
    <b>🏙️ BETHLEHEM BERN 3D</b><br>
    Scooter: <span id="vehicle">Kukirin G2 Ultra</span><br>
    Geschwindigkeit: <span id="speed">0</span> km/h<br>
    Scooter wechseln: <button id="switch">TAB</button><br>
    <small>3D Scooter Freeride</small>
</div>

<div id="crosshair"></div>

<div id="controls">
    <b>STEUERUNG</b><br>
    W / S = Fahren und bremsen &nbsp; A / D = Lenken<br>
    E = Wheelie 🤸 &nbsp; SPACE = Bremse<br>
    TAB = Scooter wechseln
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 100, 360);

    const camera = new THREE.PerspectiveCamera(
        70, window.innerWidth / window.innerHeight, 0.1, 1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xcceeff, 0x52613a, 2));

    const sunlight = new THREE.DirectionalLight(0xfff0d0, 2.2);
    sunlight.position.set(60, 100, 30);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(2048, 2048);
    scene.add(sunlight);

    // Materialien
    const mat = (color, roughness = 0.85) =>
        new THREE.MeshStandardMaterial({ color, roughness });

    const grassMat = mat(0x62934b);
    const roadMat = mat(0x363b40);
    const sidewalkMat = mat(0xb7b5a8);
    const whiteMat = mat(0xffffff);
    const blackMat = mat(0x17191c, 0.55);
    const metalMat = mat(0x8d969c, 0.35);

    // Boden
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1000, 1000),
        grassMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.12;
    ground.receiveShadow = true;
    scene.add(ground);

    // Strassen
    function box(w, h, d, material, x, y, z, parent = scene) {
        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d), material
        );
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
    }

    // Kreuzung und Strassennetz
    for (let i = -5; i <= 5; i++) {
        const p = i * 38;

        box(15, 0.12, 1000, roadMat, p, -0.03, 0);
        box(1000, 0.12, 15, roadMat, 0, -0.03, p);

        // Gehwege
        for (const side of [-1, 1]) {
            box(2.2, 0.22, 1000, sidewalkMat, p + side * 8.6, 0.02, 0);
            box(1000, 0.22, 2.2, sidewalkMat, 0, 0.02, p + side * 8.6);
        }

        // Fahrbahnmarkierungen
        for (let z = -490; z < 490; z += 12) {
            box(0.14, 0.025, 5, whiteMat, p, 0.045, z);
        }
        for (let x = -490; x < 490; x += 12) {
            box(5, 0.025, 0.14, whiteMat, x, 0.045, p);
        }
    }

    // Häuser in einem Berner Wohnquartier
    const buildingColors = [
        0xe6d4b5, 0xd5b99a, 0xc5d0cf, 0xf1e8d4,
        0xb8c6b4, 0xd5c8c1, 0xe1d1aa
    ];

    function makeBuilding(x, z, w, d, h, color) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        scene.add(g);

        box(w, h, d, mat(color), 0, h / 2, 0, g);

        // Schweizerisch inspirierte Dächer
        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(Math.max(w, d) * 0.72, h * 0.19, 4),
            mat(0x75483a)
        );
        roof.position.y = h + h * 0.095;
        roof.rotation.y = Math.PI / 4;
        roof.scale.set(1, 1, Math.min(w, d) / Math.max(w, d));
        roof.castShadow = true;
        g.add(roof);

        // Fenster
        const windowMat = mat(0x456a80, 0.3);
        const rows = Math.max(1, Math.floor(h / 3.2));
        const cols = Math.max(1, Math.floor(w / 2.8));

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const wx = -w / 2 + (col + 0.5) * w / cols;
                const wy = 1.5 + row * 3;

                if (wy > h - 1) continue;

                box(
                    Math.min(0.95, w / cols * 0.45),
                    1.15, 0.08, windowMat,
                    wx, wy, d / 2 + 0.045, g
                );

                box(
                    0.06, 1.25, 0.1, whiteMat,
                    wx, wy, d / 2 + 0.1, g
                );
            }
        }

        // Eingang
        box(1.2, 2.2, 0.12, mat(0x604632),
            0, 1.1, d / 2 + 0.07, g);
    }

    for (let x = -180; x <= 180; x += 24) {
        for (let z = -180; z <= 180; z += 24) {
            const roadDistanceX = Math.abs(x % 38);
            const roadDistanceZ = Math.abs(z % 38);

            if (roadDistanceX < 12 || roadDistanceZ < 12) continue;

            const w = 9 + Math.random() * 6;
            const d = 9 + Math.random() * 5;
            const h = 8 + Math.random() * 14;

            makeBuilding(
                x + (Math.random() - 0.5) * 5,
                z + (Math.random() - 0.5) * 5,
                w, d, h,
                buildingColors[
                    Math.floor(Math.random() * buildingColors.length)
                ]
            );
        }
    }

    // Bäume
    function makeTree(x, z) {
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.35, 2.5, 7),
            mat(0x69462d)
        );
        trunk.position.set(x, 1.25, z);
        trunk.castShadow = true;
        scene.add(trunk);

        const leaves = new THREE.Mesh(
            new THREE.SphereGeometry(1.7, 8, 7),
            mat(0x397346)
        );
        leaves.position.set(x, 3.7, z);
        leaves.castShadow = true;
        scene.add(leaves);
    }

    for (let x = -190; x <= 190; x += 20) {
        for (let z = -190; z <= 190; z += 20) {
            if (Math.abs(x % 38) > 11 && Math.abs(z % 38) > 11) continue;
            if (Math.random() > 0.55) makeTree(x + 3, z + 3);
        }
    }

    // Strassenlaternen
    function makeLamp(x, z) {
        box(0.13, 5, 0.13, metalMat, x, 2.5, z);
        box(1.1, 0.12, 0.12, metalMat, x + 0.45, 4.9, z);

        const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 8, 8),
            mat(0xffedb0, 0.2)
        );
        bulb.position.set(x + 0.9, 4.75, z);
        scene.add(bulb);
    }

    for (let i = -180; i <= 180; i += 30) {
        makeLamp(10.8, i);
        makeLamp(-10.8, i);
    }

    // Scooter erstellen
    function createScooter(type) {
        const root = new THREE.Group();
        const model = new THREE.Group();
        root.add(model);

        const isNinebot = type === "Ninebot C2 Pro";
        const deckColor = isNinebot ? 0x222222 : 0x252a30;
        const accentColor = isNinebot ? 0x29a8e0 : 0xff8a22;

        // Räder
        function wheel(z) {
            const tire = new THREE.Mesh(
                new THREE.TorusGeometry(0.37, 0.105, 10, 20),
                blackMat
            );
            tire.rotation.y = Math.PI / 2;
            tire.position.set(0, 0.43, z);
            tire.castShadow = true;
            model.add(tire);

            const hub = new THREE.Mesh(
                new THREE.CylinderGeometry(0.23, 0.23, 0.16, 16),
                metalMat
            );
            hub.rotation.z = Math.PI / 2;
            hub.position.set(0, 0.43, z);
            model.add(hub);

            const center = new THREE.Mesh(
                new THREE.CylinderGeometry(0.09, 0.09, 0.18, 12),
                mat(accentColor)
            );
            center.rotation.z = Math.PI / 2;
            center.position.set(0, 0.43, z);
            model.add(center);
        }

        wheel(-0.95);
        wheel(0.95);

        // Trittbrett
        box(0.42, 0.16, 1.55, mat(deckColor),
            0, 0.76, 0, model);

        box(0.44, 0.035, 1.3, mat(accentColor),
            0, 0.86, 0, model);

        // Lenkerstange
        const stem = new THREE.Group();
        stem.position.set(0, 0.8, -0.68);
        model.add(stem);

        const bar = box(0.13, 1.25, 0.13, metalMat,
            0, 0.63, 0, stem);
        bar.rotation.x = -0.16;

        // Lenker
        box(1.05, 0.11, 0.13, mat(deckColor),
            0, 1.25, -0.1, stem);

        box(0.18, 0.13, 0.17, mat(0x222222),
            -0.48, 1.25, -0.1, stem);
        box(0.18, 0.13, 0.17, mat(0x222222),
            0.48, 1.25, -0.1, stem);

        // Licht
        const light = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.18, 0.08),
            mat(0xfff4c2, 0.25)
        );
        light.position.set(0, 1.45, -0.15);
        stem.add(light);

        // Display
        box(0.24, 0.12, 0.17, mat(0x1e6f83),
            0, 1.38, -0.1, stem);

        return { root, model, stem, type };
    }

    let currentType = 0;
    const types = ["Kukirin G2 Ultra", "Ninebot C2 Pro"];
    let scooter = createScooter(types[currentType]);

    scooter.root.position.set(0, 0, 0);
    scene.add(scooter.root);

    // Fahrphysik
    const keys = {};
    let speed = 0;
    let heading = 0;
    let wheelie = 0;
    let steering = 0;

    document.addEventListener("keydown", e => {
        keys[e.code] = true;

        if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) {
            e.preventDefault();
        }

        if (e.code === "Tab") {
            e.preventDefault();
            switchScooter();
        }
    });

    document.addEventListener("keyup", e => {
        keys[e.code] = false;
    });

    document.getElementById("switch").onclick = switchScooter;

    function switchScooter() {
        scene.remove(scooter.root);
        currentType = (currentType + 1) % types.length;
        scooter = createScooter(types[currentType]);
        scene.add(scooter.root);
        scooter.root.position.set(
            playerX, 0, playerZ
        );
        scooter.root.rotation.y = heading;
        scooter.model.rotation.x = 0;
        document.getElementById("vehicle").textContent = types[currentType];
    }

    let playerX = 0;
    let playerZ = 0;
    let verticalBob = 0;

    // Kamera
    camera.position.set(0, 5, 8);

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.04);

        // Beschleunigung
        if (keys["KeyW"]) speed += 13 * dt;
        if (keys["KeyS"]) speed -= 10 * dt;

        if (keys["Space"]) speed *= Math.pow(0.02, dt);

        speed *= Math.pow(0.985, dt * 60);
        speed = THREE.MathUtils.clamp(speed, -12, 28);

        // Lenken
        let targetSteering = 0;
        if (keys["KeyA"]) targetSteering = 0.55;
        if (keys["KeyD"]) targetSteering = -0.55;

        steering = THREE.MathUtils.lerp(
            steering, targetSteering, Math.min(1, dt * 7)
        );

        if (Math.abs(speed) > 0.15) {
            heading += steering * speed * dt * 0.085;
        }

        // Wheelie mit E
        const targetWheelie = keys["KeyE"] ? 0.48 : 0;
        wheelie = THREE.MathUtils.lerp(
            wheelie, targetWheelie, Math.min(1, dt * 4)
        );

        scooter.model.rotation.x = -wheelie;
        scooter.stem.rotation.y = steering * 0.5;

        // Fahren
        playerX += Math.sin(heading) * speed * dt;
        playerZ -= Math.cos(heading) * speed * dt;

        scooter.root.position.set(playerX, 0, playerZ);
        scooter.root.rotation.y = heading;

        // Kamera folgt dem Scooter
        const camDistance = 7.5;
        const desiredCamera = new THREE.Vector3(
            playerX - Math.sin(heading) * camDistance,
            3.4 + Math.abs(speed) * 0.025,
            playerZ + Math.cos(heading) * camDistance
        );

        camera.position.lerp(
            desiredCamera, 1 - Math.pow(0.001, dt)
        );

        const lookAt = new THREE.Vector3(
            playerX + Math.sin(heading) * 3,
            1.0 + wheelie * 0.3,
            playerZ - Math.cos(heading) * 3
        );

        camera.lookAt(lookAt);

        document.getElementById("speed").textContent =
            Math.round(Math.abs(speed) * 3.6);

        renderer.render(scene, camera);
    }

    // Startposition
    scooter.root.position.set(playerX, 0, playerZ);

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
})();
</script>
</body>
</html>
