<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Subway Runner - Endless Run</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101323;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}

#gameBox {
    position: relative;
    width: min(100vw, 900px);
    overflow: hidden;
    background: #17213c;
    box-shadow: 0 0 35px #00c8ff33;
}

canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
    display: block;
    touch-action: none;
}

#hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 2;
}

.stat {
    background: #101323cc;
    border: 1px solid #ffffff44;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
}

#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #080d1dc9;
    z-index: 5;
    padding: 24px;
}

.panel {
    max-width: 440px;
}

h1 {
    font-size: clamp(32px, 7vw, 58px);
    margin: 0 0 12px;
    color: #ffd52a;
    text-shadow: 3px 4px #e84b16, 0 0 25px #ffb30066;
}

p {
    line-height: 1.6;
    color: #e3eaff;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 15px 25px;
    background: linear-gradient(135deg, #ffdc35, #ff7a18);
    color: #241500;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #a7430a;
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #a7430a;
}

#controls {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    z-index: 3;
    pointer-events: none;
}

.control {
    pointer-events: auto;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    padding: 0;
    background: #101323bb;
    color: white;
    border: 2px solid #ffffff99;
    box-shadow: none;
    font-size: 24px;
}

#hint {
    position: absolute;
    bottom: 88px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-size: 12px;
    text-shadow: 0 2px 4px black;
    pointer-events: none;
}

@media (min-width: 700px) {
    #controls, #hint {
        opacity: 0.65;
    }
}
</style>
</head>

<body>

<div id="gameBox">

    <canvas id="game" width="600" height="900"></canvas>

    <div id="hud">
        <div class="stat">🏃 <span id="score">0</span> m</div>
        <div class="stat">🪙 <span id="coins">0</span></div>
        <div class="stat">🏆 <span id="best">0</span></div>
    </div>

    <div id="hint">⬅️ ➡️ Spur wechseln · ⬆️ Springen · ⬇️ Rutschen</div>

    <div id="controls">
        <button class="control" id="left">⬅</button>
        <button class="control" id="jump">⬆</button>
        <button class="control" id="slide">⬇</button>
        <button class="control" id="right">➡</button>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1>SUBWAY<br>RUNNER</h1>
            <p id="intro">
                🚆 Laufe durch die U-Bahn!<br>
                Weiche Zügen und Hindernissen aus.<br>
                Sammle Münzen und schlage deinen Rekord!
            </p>
            <p>⬅️ ➡️ Wechseln<br>⬆️ Springen · ⬇️ Rutschen</p>
            <button id="start">SPIELEN ▶</button>
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");

let best = Number(localStorage.getItem("subwayRunnerBest")) || 0;
bestEl.textContent = best;

let running = false;
let gameOver = false;
let lastTime = 0;
let elapsed = 0;
let distance = 0;
let coinCount = 0;
let speed = 0.34;
let spawnTimer = 0;
let coinTimer = 0;
let shake = 0;

let player;
let objects;
let particles;

function newPlayer() {
    return {
        lane: 1,
        visualLane: 1,
        jump: 0,
        jumpVelocity: 0,
        sliding: 0
    };
}

function resetGame() {
    player = newPlayer();
    objects = [];
    particles = [];

    elapsed = 0;
    distance = 0;
    coinCount = 0;
    speed = 0.34;
    spawnTimer = 0.8;
    coinTimer = 0.4;
    shake = 0;

    gameOver = false;

    scoreEl.textContent = "0";
    coinsEl.textContent = "0";
}

function startGame() {
    resetGame();
    running = true;
    overlay.style.display = "none";
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function endGame() {
    if (!running) return;

    running = false;
    gameOver = true;
    shake = 14;

    if (distance > best) {
        best = distance;
        localStorage.setItem("subwayRunnerBest", best);
        bestEl.textContent = best;
    }

    intro.innerHTML =
        "💥 <b>GAME OVER!</b><br><br>" +
        "🏃 Distanz: " + Math.floor(distance) + " m<br>" +
        "🪙 Münzen: " + coinCount + "<br>" +
        "🏆 Rekord: " + best + " m";

    startBtn.textContent = "NOCHMAL SPIELEN ↻";
    overlay.style.display = "flex";
}

function moveLane(dir) {
    if (!running) return;

    player.lane = Math.max(0, Math.min(2, player.lane + dir));
}

function jump() {
    if (!running) return;

    if (player.jump <= 0 && player.sliding <= 0) {
        player.jumpVelocity = 720;
        player.jump = 1;
        burst(300, 700, "#ffe14a", 7);
    }
}

function slide() {
    if (!running) return;

    if (player.jump <= 0) {
        player.sliding = 0.65;
    }
}

// Steuerung per Tastatur
document.addEventListener("keydown", e => {
    if ([
        "ArrowLeft", "ArrowRight",
        "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"
    ].includes(e.code)) {
        e.preventDefault();
    }

    if (!running) {
        if (e.code === "Space" || e.code === "Enter") {
            startGame();
        }
        return;
    }

    if (e.repeat) return;

    if (e.code === "ArrowLeft" || e.code === "KeyA") moveLane(-1);
    if (e.code === "ArrowRight" || e.code === "KeyD") moveLane(1);
    if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") jump();
    if (e.code === "ArrowDown" || e.code === "KeyS") slide();
});

// Bildschirmtasten
document.getElementById("left").addEventListener("pointerdown", e => {
    e.preventDefault();
    moveLane(-1);
});

document.getElementById("right").addEventListener("pointerdown", e => {
    e.preventDefault();
    moveLane(1);
});

document.getElementById("jump").addEventListener("pointerdown", e => {
    e.preventDefault();
    jump();
});

document.getElementById("slide").addEventListener("pointerdown", e => {
    e.preventDefault();
    slide();
});

startBtn.addEventListener("click", startGame);

// Wischsteuerung
let touchStart = null;

canvas.addEventListener("pointerdown", e => {
    if (e.target !== canvas) return;

    touchStart = {
        x: e.clientX,
        y: e.clientY,
        time: performance.now()
    };
});

canvas.addEventListener("pointerup", e => {
    if (!touchStart || !running) {
        touchStart = null;
        return;
    }

    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;

    if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
        if (Math.abs(dx) > Math.abs(dy)) {
            moveLane(dx > 0 ? 1 : -1);
        } else if (dy < 0) {
            jump();
        } else {
            slide();
        }
    } else {
        jump();
    }

    touchStart = null;
});

// Perspektive: z = 0 ist weit entfernt, z = 1 ist beim Spieler
function project(lane, z) {
    const perspective = Math.max(0, Math.min(1.3, z));
    const horizon = 190;

    const y = horizon + (H - horizon) * perspective;
    const center = W / 2;
    const spread = 55 + 190 * perspective;

    return {
        x: center + (lane - 1) * spread,
        y: y,
        scale: 0.18 + perspective * 1.15
    };
}

function roadWidth(z) {
    return 100 + 400 * z;
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#18254b");
    sky.addColorStop(0.5, "#345b7b");
    sky.addColorStop(1, "#192235");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stadt-Silhouette
    for (let i = 0; i < 17; i++) {
        const x = i * 39 - 10;
        const height = 45 + (i * 37 % 110);

        ctx.fillStyle = i % 2 ? "#1b2740" : "#202d48";
        ctx.fillRect(x, 190 - height, 34, height);

        for (let wy = 205 - height; wy < 185; wy += 19) {
            for (let wx = x + 6; wx < x + 30; wx += 12) {
                ctx.fillStyle = (wx + wy) % 3
                    ? "#ffdb7355"
                    : "#8be9ff33";

                ctx.fillRect(wx, wy, 5, 8);
            }
        }
    }

    // Gleisbett
    ctx.fillStyle = "#353b4c";
    ctx.beginPath();
    ctx.moveTo(W / 2 - 60, 190);
    ctx.lineTo(W / 2 + 60, 190);
    ctx.lineTo(W + 100, H);
    ctx.lineTo(-100, H);
    ctx.closePath();
    ctx.fill();

    // Gleisrand
    ctx.strokeStyle = "#a7b7c7";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(W / 2 - 45, 190);
    ctx.lineTo(-15, H);
    ctx.moveTo(W / 2 + 45, 190);
    ctx.lineTo(W + 15, H);
    ctx.stroke();

    // Schwellen
    for (let i = 0; i < 18; i++) {
        let z = ((i / 18 + elapsed * speed * 0.5) % 1);
        const y = 190 + (H - 190) * z;
        const width = roadWidth(z) * 0.9;

        ctx.strokeStyle = "#111a2a";
        ctx.lineWidth = 2 + z * 9;

        ctx.beginPath();
        ctx.moveTo(W / 2 - width / 2, y);
        ctx.lineTo(W / 2 + width / 2, y);
        ctx.stroke();
    }

    // Drei Spuren
    ctx.strokeStyle = "#d9e3f355";
    ctx.lineWidth = 2;

    for (const lane of [0, 1]) {
        ctx.beginPath();

        const topX = W / 2 + (lane - 0.5) * 36;
        const bottomX = W / 2 + (lane - 0.5) * 260;

        ctx.moveTo(topX, 190);
        ctx.lineTo(bottomX, H);
        ctx.stroke();
    }

    // Lampen am Gleis
    for (let i = 0; i < 8; i++) {
        const z = ((i / 8 + elapsed * speed * 0.28) % 1);
        const y = 200 + z * 500;
        const xSpread = 100 + z * 320;

        ctx.fillStyle = "#ffd86b";
        ctx.fillRect(W / 2 - xSpread - 4, y - 30 * z, 5 + 5 * z, 12 + 12 * z);

        ctx.fillStyle = "#68e8ff";
        ctx.fillRect(W / 2 + xSpread, y - 30 * z, 5 + 5 * z, 12 + 12 * z);
    }
}

function drawCoin(o) {
    const p = project(o.lane, o.z);
    const r = 10 * p.scale + 3;

    ctx.save();

    ctx.translate(p.x, p.y - 45 * p.scale);
    ctx.scale(0.75 + Math.abs(Math.sin(elapsed * 8)) * 0.25, 1);

    ctx.shadowColor = "#ffda38";
    ctx.shadowBlur = 18;

    ctx.fillStyle = "#ffbf24";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#fff4a6";
    ctx.lineWidth = 3 * p.scale;
    ctx.stroke();

    ctx.fillStyle = "#fff6bb";
    ctx.font = `bold ${Math.max(8, r)}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);

    ctx.restore();
}

function drawObstacle(o) {
    const p = project(o.lane, o.z);
    const s = p.scale;

    ctx.save();
    ctx.translate(p.x, p.y);

    if (o.type === "train") {
        const w = 76 * s;
        const h = 190 * s;

        ctx.fillStyle = "#d5e1ec";
        ctx.fillRect(-w / 2, -h, w, h);

        ctx.fillStyle = "#ef4c52";
        ctx.fillRect(-w / 2, -h + 12 * s, w, 30 * s);

        ctx.fillStyle = "#192f50";
        ctx.fillRect(-w / 2 + 8 * s, -h + 53 * s, w - 16 * s, 52 * s);

        ctx.fillStyle = "#70ddff";
        ctx.fillRect(-w / 2 + 12 * s, -h + 58 * s, 17 * s, 40 * s);
        ctx.fillRect(3 * s, -h + 58 * s, 17 * s, 40 * s);

        ctx.fillStyle = "#fff2a0";
        ctx.fillRect(-w / 2 + 8 * s, -15 * s, 12 * s, 8 * s);
        ctx.fillRect(w / 2 - 20 * s, -15 * s, 12 * s, 8 * s);

        ctx.fillStyle = "#20283b";
        ctx.fillRect(-w / 2 - 4 * s, -5 * s, w + 8 * s, 10 * s);

    } else if (o.type === "barrier") {
        const w = 78 * s;
        const h = 62 * s;

        ctx.fillStyle = "#303849";
        ctx.fillRect(-w / 2, -h, 12 * s, h);
        ctx.fillRect(w / 2 - 12 * s, -h, 12 * s, h);

        ctx.fillStyle = "#f5f5f5";
        ctx.fillRect(-w / 2, -h, w, 31 * s);

        ctx.fillStyle = "#ed4352";

        ctx.beginPath();
        ctx.moveTo(-w / 2, -h);
        ctx.lineTo(-w / 2 + 22 * s, -h);
        ctx.lineTo(-w / 2 + 40 * s, -h + 31 * s);
        ctx.lineTo(-w / 2 + 18 * s, -h + 31 * s);
        ctx.closePath();
        ctx.fill();

        ctx.fillRect(12 * s, -h, 15 * s, 31 * s);

    } else if (o.type === "overhead") {
        const w = 88 * s;
        const h = 135 * s;

        ctx.fillStyle = "#333b4d";
        ctx.fillRect(-w / 2, -h, 10 * s, h);
        ctx.fillRect(w / 2 - 10 * s, -h, 10 * s, h);

        ctx.fillStyle = "#efae29";
        ctx.fillRect(-w / 2, -h, w, 32 * s);

        ctx.fillStyle = "#242a3a";
        ctx.fillRect(-w / 2, -h + 32 * s, w, 9 * s);

        ctx.fillStyle = "#fff";
        ctx.font = `bold ${Math.max(8, 12 * s)}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText("SLIDE!", 0, -h + 21 * s);
    }

    ctx.restore();
}

function drawPlayer() {
    const lanePos = 1 + (player.visualLane - 1) * 0.9;
    const p = project(lanePos, 1);

    const x = p.x;
    const groundY = 770;
    const jumpHeight = player.jump * 150;

    const y = groundY - jumpHeight;
    const sliding = player.sliding > 0;

    // Schatten
    ctx.fillStyle = "#00000055";
    ctx.beginPath();
    ctx.ellipse(x, groundY + 3, sliding ? 40 : 28, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);

    if (sliding) {
        ctx.rotate(-0.08);

        // Körper beim Rutschen
        ctx.fillStyle = "#13c9f3";
        ctx.fillRect(-33, -35, 60, 26);

        ctx.fillStyle = "#ffcc9a";
        ctx.beginPath();
        ctx.arc(27, -34, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f5cf24";
        ctx.fillRect(-38, -40, 25, 8);

        ctx.fillStyle = "#242b46";
        ctx.fillRect(-22, -12, 30, 8);

    } else {
        // Beine
        ctx.fillStyle = "#293b70";
        ctx.fillRect(-19, -47, 14, 42);
        ctx.fillRect(5, -47, 14, 42);

        // Schuhe
        ctx.fillStyle = "#ffdb32";
        ctx.fillRect(-24, -10, 22, 10);
        ctx.fillRect(2, -10, 22, 10);

        // Arme
        ctx.strokeStyle = "#ffcc9a";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(-17, -90);
        ctx.lineTo(-30, -62);
        ctx.moveTo(17, -90);
        ctx.lineTo(30, -69);
        ctx.stroke();

        // Körper
        ctx.fillStyle = "#11c6ed";
        ctx.fillRect(-22, -100, 44, 55);

        ctx.fillStyle = "#ffdb32";
        ctx.fillRect(-22, -100, 44, 9);

        // Kopf
        ctx.fillStyle = "#ffcc9a";
        ctx.beginPath();
        ctx.arc(0, -117, 22, 0, Math.PI * 2);
        ctx.fill();

        // Haare
        ctx.fillStyle = "#533525";
        ctx.beginPath();
        ctx.arc(0, -125, 22, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(-22, -127, 10, 15);

        // Augen
        ctx.fillStyle = "#242424";
        ctx.fillRect(6, -121, 4, 6);

        // Rucksack
        ctx.fillStyle = "#f04b48";
        ctx.fillRect(-27, -95, 12, 30);
    }

    ctx.restore();
}

function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 240,
            vy: (Math.random() - 0.5) * 240,
            life: 0.4 + Math.random() * 0.5,
            color
        });
    }
}

function drawParticles(dt) {
    for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;

        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 6, 6);
    }

    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
}

function spawnObstacle() {
    const lane = Math.floor(Math.random() * 3);
    const r = Math.random();

    let type;

    if (r < 0.38) {
        type = "barrier";
    } else if (r < 0.70) {
        type = "train";
    } else {
        type = "overhead";
    }

    objects.push({
        lane,
        z: 0,
        type,
        collected: false
    });
}

function spawnCoins() {
    const lane = Math.floor(Math.random() * 3);

    for (let i = 0; i < 5; i++) {
        objects.push({
            lane,
            z: -i * 0.13,
            type: "coin",
            collected: false
        });
    }
}

function update(dt) {
    elapsed += dt;

    distance += speed * dt * 18;
    speed = Math.min(0.85, 0.34 + distance / 6000);

    scoreEl.textContent = Math.floor(distance);
    coinsEl.textContent = coinCount;

    // Sanfter Spurwechsel
    player.visualLane +=
        (player.lane - player.visualLane) * Math.min(1, dt * 12);

    // Sprungphysik
    if (player.jump > 0 || player.jumpVelocity > 0) {
        player.jump += player.jumpVelocity * dt / 150;
        player.jumpVelocity -= 1850 * dt;

        if (player.jump <= 0) {
            player.jump = 0;
            player.jumpVelocity = 0;
        }
    }

    if (player.sliding > 0) {
        player.sliding -= dt;
    }

    // Hindernisse und Münzen
    spawnTimer -= dt;
    coinTimer -= dt;

    if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = Math.max(0.65, 1.15 - speed * 0.45) + Math.random() * 0.45;
    }

    if (coinTimer <= 0) {
        spawnCoins();
        coinTimer = 2.3 + Math.random() * 1.5;
    }

    for (const o of objects) {
        o.z += speed * dt;

        if (o.collected || o.z < 0) continue;

        // Münzen einsammeln
        if (o.type === "coin") {
            if (o.z > 0.86 &&
                o.z < 1.06 &&
                Math.round(player.visualLane) === o.lane &&
                Math.abs(player.visualLane - o.lane) < 0.38) {

                o.collected = true;
                coinCount++;
                coinsEl.textContent = coinCount;

                const p = project(o.lane, o.z);
                burst(p.x, p.y - 40, "#ffd52a", 9);
            }

            continue;
        }

        // Kollision nahe beim Spieler
        if (o.z > 0.88 &&
            o.z < 1.04 &&
            Math.abs(player.visualLane - o.lane) < 0.38) {

            let hit = false;

            if (o.type === "barrier") {
                // Über niedrige Barrieren springen
                hit = player.jump < 0.28;
            } else if (o.type === "train") {
                // Zug vollständig vermeiden
                hit = player.jump < 0.70;
            } else if (o.type === "overhead") {
                // Unter dem Hindernis durchrutschen
                hit = player.sliding <= 0;
            }

            if (hit) {
                endGame();
                return;
            }

            o.collected = true;
        }
    }

    objects = objects.filter(o => o.z < 1.15 && !o.collected);
}

function render(dt) {
    ctx.save();

    if (shake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );

        shake = Math.max(0, shake - dt * 30);
    }

    drawBackground();

    // Objekte von hinten nach vorne zeichnen
    const sorted = [...objects].sort((a, b) => a.z - b.z);

    for (const o of sorted) {
        if (o.z < 0) continue;

        if (o.type === "coin") {
            drawCoin(o);
        } else {
            drawObstacle(o);
        }
    }

    drawPlayer();
    drawParticles(dt);

    ctx.restore();
}

function loop(timestamp) {
    if (!running) return;

    const dt = Math.min((timestamp - lastTime) / 1000, 0.04);
    lastTime = timestamp;

    update(dt);
    render(dt);

    if (running) {
        requestAnimationFrame(loop);
    }
}

// Vorschau auf dem Startbildschirm
function preview() {
    if (running) return;

    elapsed += 0.012;

    drawBackground();

    const demoPlayer = {
        lane: 1,
        visualLane: 1,
        jump: 0,
        sliding: 0
    };

    const oldPlayer = player;
    player = demoPlayer;

    drawPlayer();

    player = oldPlayer;

    requestAnimationFrame(preview);
}
