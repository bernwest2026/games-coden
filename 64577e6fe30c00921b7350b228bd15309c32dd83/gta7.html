<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Crime - Mini GTA</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        background: #4b8f45;
    }

    #hud {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,.65);
        padding: 12px 16px;
        border-radius: 10px;
        z-index: 10;
        user-select: none;
    }

    #mission {
        position: fixed;
        top: 15px;
        right: 15px;
        color: white;
        background: rgba(0,0,0,.65);
        padding: 12px 16px;
        border-radius: 10px;
        z-index: 10;
        max-width: 260px;
    }

    #help {
        position: fixed;
        bottom: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,.65);
        padding: 10px 14px;
        border-radius: 10px;
        z-index: 10;
    }

    .wanted {
        color: #ff3333;
        font-size: 20px;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
    💵 Geld: $<span id="money">500</span><br>
    ❤️ Leben: <span id="health">100</span><br>
    🚓 Fahndung: <span class="wanted" id="wanted">☆☆☆☆☆</span>
</div>

<div id="mission">
    🎯 <b>Mission</b><br>
    Fahre zum gelben Marker!
</div>

<div id="help">
    WASD / Pfeiltasten = Fahren &nbsp; | &nbsp; E = Mission
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize", () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const world = {
    width: 3000,
    height: 3000
};

let money = 500;
let health = 100;
let wanted = 0;

const player = {
    x: 1500,
    y: 1500,
    angle: 0,
    speed: 0,
    maxSpeed: 7,
    color: "#e53935"
};

const buildings = [];
const cars = [];
const npcs = [];
const coins = [];

function random(min, max) {
    return Math.random() * (max - min) + min;
}

// Gebäude
for (let x = 150; x < world.width - 150; x += 420) {
    for (let y = 150; y < world.height - 150; y += 420) {
        buildings.push({
            x: x + 45,
            y: y + 45,
            w: 270,
            h: 260,
            color: ["#777", "#888", "#666", "#9b7653"][Math.floor(Math.random()*4)]
        });
    }
}

// NPCs
for (let i = 0; i < 35; i++) {
    npcs.push({
        x: random(100, world.width - 100),
        y: random(100, world.height - 100),
        speed: random(.5, 1.5),
        dir: random(0, Math.PI * 2),
        color: ["#3498db","#f1c40f","#9b59b6","#1abc9c"][Math.floor(Math.random()*4)]
    });
}

// Autos
for (let i = 0; i < 20; i++) {
    cars.push({
        x: random(100, world.width - 100),
        y: random(100, world.height - 100),
        angle: random(0, Math.PI*2),
        speed: random(1, 2),
        color: ["#3498db","#f1c40f","#9b59b6","#ecf0f1","#2ecc71"][Math.floor(Math.random()*5)]
    });
}

// Geld
for (let i = 0; i < 30; i++) {
    coins.push({
        x: random(100, world.width - 100),
        y: random(100, world.height - 100),
        collected: false
    });
}

const mission = {
    x: 2200,
    y: 800,
    active: true,
    reward: 1000
};

function distance(a,b) {
    return Math.hypot(a.x-b.x, a.y-b.y);
}

function collisionWithBuilding(x,y) {
    for (const b of buildings) {
        if (
            x > b.x - 20 &&
            x < b.x + b.w + 20 &&
            y > b.y - 20 &&
            y < b.y + b.h + 20
        ) return true;
    }
    return false;
}

function update() {

    // Beschleunigung
    if (keys["w"] || keys["arrowup"]) {
        player.speed += .25;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.speed -= .25;
    }

    player.speed *= .94;

    player.speed = Math.max(
        -player.maxSpeed / 2,
        Math.min(player.maxSpeed, player.speed)
    );

    if (keys["a"] || keys["arrowleft"]) {
        player.angle -= .045 * (Math.abs(player.speed) + .5);
    }

    if (keys["d"] || keys["arrowright"]) {
        player.angle += .045 * (Math.abs(player.speed) + .5);
    }

    const newX =
        player.x + Math.cos(player.angle) * player.speed;

    const newY =
        player.y + Math.sin(player.angle) * player.speed;

    if (!collisionWithBuilding(newX,newY)) {
        player.x = newX;
        player.y = newY;
    } else {
        player.speed *= -.4;
    }

    // Weltgrenzen
    player.x = Math.max(30, Math.min(world.width-30, player.x));
    player.y = Math.max(30, Math.min(world.height-30, player.y));

    // NPC Bewegung
    for (const n of npcs) {
        n.x += Math.cos(n.dir) * n.speed;
        n.y += Math.sin(n.dir) * n.speed;

        if (
            n.x < 50 ||
            n.x > world.width-50 ||
            n.y < 50 ||
            n.y > world.height-50
        ) {
            n.dir += Math.PI;
        }

        if (distance(player,n) < 35 && Math.abs(player.speed) > 3) {
            wanted = Math.min(5, wanted + 1);
            health -= .3;
            player.speed *= -.5;
        }
    }

    // Geld einsammeln
    for (const c of coins) {
        if (!c.collected && distance(player,c) < 35) {
            c.collected = true;
            money += 100;
        }
    }

    // Mission
    if (mission.active && distance(player, mission) < 80) {
        if (keys["e"]) {
            mission.active = false;
            money += mission.reward;
            wanted = Math.min(5, wanted + 1);
            document.getElementById("mission").innerHTML =
                "✅ Mission geschafft!<br>💰 +$1000";
        }
    }

    // Fahndung sinkt langsam
    if (wanted > 0 && Math.random() < 0.001) {
        wanted--;
    }

    if (health <= 0) {
        health = 100;
        player.x = 1500;
        player.y = 1500;
        player.speed = 0;
        money = Math.max(0, money - 500);
        wanted = 0;
    }

    document.getElementById("money").textContent = money;
    document.getElementById("health").textContent = Math.floor(health);

    let stars = "";
    for (let i=0;i<5;i++) {
        stars += i < wanted ? "★" : "☆";
    }
    document.getElementById("wanted").textContent = stars;
}

function drawRoads() {
    ctx.fillStyle = "#333";

    for (let x=0; x<world.width; x+=420) {
        ctx.fillRect(x,0,110,world.height);
    }

    for (let y=0; y<world.height; y+=420) {
        ctx.fillRect(0,y,world.width,110);
    }

    // Straßenmarkierungen
    ctx.strokeStyle = "#e6d85c";
    ctx.lineWidth = 4;
    ctx.setLineDash([25,25]);

    for (let x=55; x<world.width; x+=420) {
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,world.height);
        ctx.stroke();
    }

    for (let y=55; y<world.height; y+=420) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(world.width,y);
        ctx.stroke();
    }

    ctx.setLineDash([]);
}

function drawBuildings() {
    for (const b of buildings) {
        ctx.fillStyle = "rgba(0,0,0,.25)";
        ctx.fillRect(b.x+8,b.y+8,b.w,b.h);

        ctx.fillStyle = b.color;
        ctx.fillRect(b.x,b.y,b.w,b.h);

        ctx.fillStyle = "#b9e3ff";

        for (let wx=b.x+25; wx<b.x+b.w-20; wx+=45) {
            for (let wy=b.y+25; wy<b.y+b.h-20; wy+=45) {
                ctx.fillRect(wx,wy,20,25);
            }
        }
    }
}

function drawCars() {
    for (const car of cars) {
        ctx.save();
        ctx.translate(car.x,car.y);
        ctx.rotate(car.angle);

        ctx.fillStyle = car.color;
        ctx.fillRect(-22,-12,44,24);

        ctx.fillStyle = "#222";
        ctx.fillRect(-12,-9,15,18);

        ctx.fillStyle = "#eee";
        ctx.fillRect(12,-9,7,18);

        ctx.restore();
    }
}

function drawNPCs() {
    for (const n of npcs) {
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x,n.y,10,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#f2c6a0";
        ctx.beginPath();
        ctx.arc(n.x,n.y-12,7,0,Math.PI*2);
        ctx.fill();
    }
}

function drawCoins() {
    for (const c of coins) {
        if (c.collected) continue;

        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(c.x,c.y,9,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#8a6d00";
        ctx.font = "bold 10px Arial";
        ctx.fillText("$",c.x-3,c.y+4);
    }
}

function drawMission() {
    if (!mission.active) return;

    ctx.fillStyle = "#ffe600";
    ctx.beginPath();
    ctx.arc(mission.x,mission.y,30,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("!",mission.x,mission.y+7);
    ctx.textAlign = "left";
}

function drawPlayer() {
    ctx.save();

    ctx.translate(player.x,player.y);
    ctx.rotate(player.angle);

    // Auto
    ctx.fillStyle = player.color;
    ctx.fillRect(-28,-16,56,32);

    // Fenster
    ctx.fillStyle = "#8ed6ff";
    ctx.fillRect(-5,-12,22,24);

    // Reifen
    ctx.fillStyle = "#111";
    ctx.fillRect(-20,-20,12,7);
    ctx.fillRect(10,-20,12,7);
    ctx.fillRect(-20,13,12,7);
    ctx.fillRect(10,13,12,7);

    ctx.restore();
}

function draw() {

    const camX = player.x - canvas.width/2;
    const camY = player.y - canvas.height/2;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-camX,-camY);

    // Gras
    ctx.fillStyle = "#4b8f45";
    ctx.fillRect(0,0,world.width,world.height);

    drawRoads();
    drawBuildings();
    drawCoins();
    drawCars();
    drawNPCs();
    drawMission();
    drawPlayer();

    ctx.restore();

    // Mini-map
    drawMiniMap();
}

function drawMiniMap() {
    const size = 150;
    const x = canvas.width-size-20;
    const y = canvas.height-size-20;

    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(x,y,size,size);

    ctx.fillStyle = "#555";

    for (const b of buildings) {
        ctx.fillRect(
            x + b.x/world.width*size,
            y + b.y/world.height*size,
            b.w/world.width*size,
            b.h/world.height*size
        );
    }

    ctx.fillStyle = "#ff3333";
    ctx.beginPath();
    ctx.arc(
        x + player.x/world.width*size,
        y + player.y/world.height*size,
        4,0,Math.PI*2
    );
    ctx.fill();

    if (mission.active) {
        ctx.fillStyle = "#ffe600";
        ctx.beginPath();
        ctx.arc(
            x + mission.x/world.width*size,
            y + mission.y/world.height*size,
            4,0,Math.PI*2
        );
        ctx.fill();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
